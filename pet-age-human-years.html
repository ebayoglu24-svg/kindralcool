<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>pet-age-human-years</title>
<style>
html,body{margin:0;height:100%;background:#F3EEF7}
body{font-family:Georgia,"Times New Roman",serif;color:#56406E;display:flex;align-items:center;justify-content:center}
.card{background:#FFFDFB;border:2px solid #C5B0D8;border-radius:18px;padding:16px 18px;max-width:400px;width:calc(100% - 24px);box-sizing:border-box;text-align:center}
.k{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#9C82B8;margin-bottom:4px}
.l{font-style:italic;font-size:17px;margin-bottom:8px}
.t{font-size:40px;line-height:1.1;margin:6px 0 2px}
.s{font-size:13px;opacity:.8}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
lab{display:block;font-size:11px;letter-spacing:1px;text-transform:lowercase;opacity:.75;text-align:left;margin-top:6px}
input,select{font-family:inherit;font-size:14px;color:#56406E;border:1px solid #C5B0D8;background:#F3EEF7;border-radius:12px;padding:7px 10px;width:100%;box-sizing:border-box;margin-top:2px}
.pills{margin:8px 0 2px}
button{font-family:inherit;font-size:13px;border:1px solid #C5B0D8;background:#FFFDFB;color:#56406E;border-radius:20px;padding:5px 12px;margin:2px;cursor:pointer}
button.on{background:#9C82B8;color:#fff;border-color:#9C82B8}
ul{list-style:none;padding:0;margin:10px 0 0;text-align:left}
li{display:flex;justify-content:space-between;gap:8px;padding:6px 2px;border-top:1px solid #C5B0D8;font-size:14px}
li b{font-weight:400}
.days{display:flex;gap:4px;justify-content:center;margin:8px 0}
.d{flex:1;border:1px solid #C5B0D8;border-radius:12px;padding:6px 0;font-size:12px}
.d b{display:block;font-size:18px;font-weight:400}
.d.on{background:#9C82B8;color:#fff;border-color:#9C82B8}
.m{font-size:12px;letter-spacing:1px;opacity:.75;margin-top:10px}
</style></head><body><div class="card">

<div class="k">pet age</div>
<div class="l">in human years</div>
<div class="pills" id="k"></div>
<lab>age in years</lab><input id="a" type="number" step="0.5" value="5">
<div class="t" id="t">0</div><div class="s" id="s"></div>
<div class="m" id="m"></div>
</div>
<script>
function $(i){return document.getElementById(i)}
function num(i){var v=parseFloat($(i).value);return isNaN(v)||v<0?0:v}
function on(ids,f){ids.forEach(function(i){$(i).addEventListener("input",f);$(i).addEventListener("change",f)});f()}

var kind="medium dog",K=[["small dog","under 20 lb"],["medium dog","20 to 50 lb"],["large dog","over 50 lb"],["cat",""]];
function hy(a){if(a<=0)return 0;var y1=kind=="large dog"?14:15,y2=kind=="large dog"?22:24,st=kind=="small dog"?4:kind=="medium dog"?5:kind=="large dog"?7:4;if(a<=1)return y1*a;if(a<=2)return y1+(y2-y1)*(a-1);return y2+(a-2)*st}
function stage(a){var big=kind=="large dog";if(a<1)return["baby","lots of short play and naps"];if(a<(big?2:3))return["young adult","training sticks best right now"];if(a<(big?6:kind=="cat"?10:8))return["adult","yearly checkups keep things easy"];return["senior","ask your vet about twice-yearly checkups"]}
function draw(){$("k").innerHTML="";K.forEach(function(x){var b=document.createElement("button");b.textContent=x[0];b.title=x[1];if(x[0]==kind)b.className="on";b.onclick=function(){kind=x[0];draw()};$("k").appendChild(b)});
var a=num("a"),st=stage(a);$("t").textContent=Math.round(hy(a));$("s").textContent="human years · "+st[0];$("m").textContent=st[1]+" · a rough guide"}
on(["a"],draw);
</script></body></html>
