<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>reno-paint-tile-estimator</title>
<style>
html,body{margin:0;height:100%;background:#F4F4F2}
body{font-family:Georgia,"Times New Roman",serif;color:#262625;display:flex;align-items:center;justify-content:center}
.card{background:#FFFDFB;border:2px solid #BDBDBA;border-radius:18px;padding:16px 18px;max-width:400px;width:calc(100% - 24px);box-sizing:border-box;text-align:center}
.k{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#3A3A38;margin-bottom:4px}
.l{font-style:italic;font-size:17px;margin-bottom:8px}
.t{font-size:40px;line-height:1.1;margin:6px 0 2px}
.s{font-size:13px;opacity:.8}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
lab{display:block;font-size:11px;letter-spacing:1px;text-transform:lowercase;opacity:.75;text-align:left;margin-top:6px}
input,select{font-family:inherit;font-size:14px;color:#262625;border:1px solid #BDBDBA;background:#F4F4F2;border-radius:12px;padding:7px 10px;width:100%;box-sizing:border-box;margin-top:2px}
.pills{margin:8px 0 2px}
button{font-family:inherit;font-size:13px;border:1px solid #BDBDBA;background:#FFFDFB;color:#262625;border-radius:20px;padding:5px 12px;margin:2px;cursor:pointer}
button.on{background:#3A3A38;color:#fff;border-color:#3A3A38}
ul{list-style:none;padding:0;margin:10px 0 0;text-align:left}
li{display:flex;justify-content:space-between;gap:8px;padding:6px 2px;border-top:1px solid #BDBDBA;font-size:14px}
li b{font-weight:400}
.days{display:flex;gap:4px;justify-content:center;margin:8px 0}
.d{flex:1;border:1px solid #BDBDBA;border-radius:12px;padding:6px 0;font-size:12px}
.d b{display:block;font-size:18px;font-weight:400}
.d.on{background:#3A3A38;color:#fff;border-color:#3A3A38}
.m{font-size:12px;letter-spacing:1px;opacity:.75;margin-top:10px}
</style></head><body><div class="card">

<div class="k">paint and tile</div>
<div class="l">how much to buy</div>
<div class="row"><div><lab>length (ft)</lab><input id="l" type="number" value="12"></div><div><lab>width (ft)</lab><input id="w" type="number" value="10"></div><div><lab>height (ft)</lab><input id="h" type="number" value="8"></div></div>
<ul id="u"></ul>
<div class="m">2 coats at about 350 sq ft a gallon · tile includes 10% extra</div>
</div>
<script>
function $(i){return document.getElementById(i)}
function num(i){var v=parseFloat($(i).value);return isNaN(v)||v<0?0:v}
function on(ids,f){ids.forEach(function(i){$(i).addEventListener("input",f);$(i).addEventListener("change",f)});f()}

on(["l","w","h"],function(){var l=num("l"),w=num("w"),h=num("h"),walls=2*(l+w)*h,floor=l*w,gal=Math.ceil(walls*2/350*2)/2,tile=Math.ceil(floor*1.1);
var L=[["wall area",Math.round(walls).toLocaleString("en-US")+" sq ft"],["paint for 2 coats",gal+" gallons"],["floor area",Math.round(floor).toLocaleString("en-US")+" sq ft"],["floor tile to buy",tile.toLocaleString("en-US")+" sq ft"]];
$("u").innerHTML="";L.forEach(function(r){var li=document.createElement("li");li.innerHTML="<span>"+r[0]+"</span><b>"+r[1]+"</b>";$("u").appendChild(li)})})
</script></body></html>
